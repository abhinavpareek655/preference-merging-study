model:
  name: "Qwen/Qwen2.5-0.5B-Instruct"
  revision: "main"

dataset:
  name: "trl-lib/ultrafeedback_binarized"
  train_split: "train"
  test_split: "test"
  subset_size: 2000
  validation_split: 0.1
  seed: 42

lora:
  r: 16
  lora_alpha: 32
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"

dpo:
  beta: 0.1
  max_length: 512
  max_prompt_length: 256
  loss_type: "sigmoid"

training:
  output_dir: "./outputs/E_pref"
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 4
  warmup_steps: 20
  max_steps: 200
  learning_rate: 1.0e-5
  fp16: true
  logging_steps: 5
  eval_strategy: "steps"
  eval_steps: 20
  save_strategy: "steps"
  save_steps: 20
  report_to: "none"
  seed: 42