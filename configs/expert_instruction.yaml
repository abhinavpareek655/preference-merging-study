model:
  name: "Qwen/Qwen2.5-0.5B-Instruct"
  revision: "main"

dataset:
  name: "HuggingFaceH4/Bespoke-Stratos-17k"
  split: "train"
  subset_size: 2000
  seed: 42

lora:
  r: 16
  lora_alpha: 32
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"

training:
  output_dir: "./outputs/E_instr"
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  warmup_steps: 20
  max_steps: 300
  learning_rate: 2.0e-5
  fp16: true
  logging_steps: 10
  save_strategy: "steps"
  save_steps: 25
  evaluation_strategy: "steps"
  eval_steps: 25
  report_to: "none"
  seed: 42
  gradient_checkpointing: True
  metric_for_best_model: "eval_loss"
  greater_is_better: False