model:
  name: "Qwen/Qwen2.5-0.5B-Instruct"
  revision: "main"

dataset:
  name: "open-r1/OpenR1-Math-220k"
  split: "train"
  subset_size: 2000
  seed: 42

lora:
  r: 16
  lora_alpha: 32
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  lora_dropout: 0.1
  bias: "none"
  task_type: "CAUSAL_LM"

training:
  output_dir: "./outputs/E_math"      # keep each file's own output_dir
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 2
  num_train_epochs: 2
  max_steps: -1
  learning_rate: 5.0e-5
  warmup_ratio: 0.05
  weight_decay: 0.01
  bf16: true
  gradient_checkpointing: false
  logging_steps: 10
  eval_steps: 50
  save_steps: 50
  report_to: "none"
  seed: 42
  max_length: 1024