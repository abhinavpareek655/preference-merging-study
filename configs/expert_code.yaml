model:
  name: "Qwen/Qwen2.5-0.5B-Instruct"
  revision: "main"

dataset:
  name: "google-research-datasets/mbpp"
  split: "train"
  subset_size: 2000
  seed: 42

lora:
  r: 8
  lora_alpha: 32
  target_modules: ["q_proj", "v_proj"]
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"

training:
  output_dir: "./outputs/E_code"
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 2
  warmup_steps: 10
  max_steps: 100
  learning_rate: 1e-4
  fp16: True
  logging_steps: 5
  save_strategy: "steps"
  save_steps: 20
  evaluation_strategy: "steps"
  eval_steps: 20
  report_to: "none"
  seed: 42